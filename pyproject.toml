[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sutra-harness"
version = "0.1.0"
description = "Sutra: an enterprise agent harness SDK (runtime, contracts, governed tools/models/context)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sandeep Gouda" }]
maintainers = [{ name = "Sandeep Gouda" }]
keywords = ["agents", "llm", "harness", "google-adk", "gemini", "opentelemetry", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/skgoudas/sutra"
Repository = "https://github.com/skgoudas/sutra"
Documentation = "https://github.com/skgoudas/sutra/tree/main/docs"
Issues = "https://github.com/skgoudas/sutra/issues"
Changelog = "https://github.com/skgoudas/sutra/blob/main/CHANGELOG.md"

[project.optional-dependencies]
adk = ["google-adk>=2.0"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
jwt = ["pyjwt[crypto]>=2.8"]
yaml = ["pyyaml>=6"]
vertex = ["google-genai>=1.0"]
all = ["sutra-harness[adk,server,otel,jwt,yaml,vertex]"]
dev = ["sutra-harness[all]", "pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/sutra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "examples"]
